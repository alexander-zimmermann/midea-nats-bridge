name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@7d4061293cd610e3bff1a4acc05a8c69bcb05e7c # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
