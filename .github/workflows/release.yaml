name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@b03b6b5bbdfb6d847741f1dde98f0ba250b92d00 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
