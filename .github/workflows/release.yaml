name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@0897b5ee78a1497f4d1ef8543d3d27103e24a3c0 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
