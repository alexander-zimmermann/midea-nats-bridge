name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@fc8196acfe5ff8370b88c3739c99e1397c9ba9ba # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
