name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@main
    with:
      tag: ${{ inputs.tag }}
