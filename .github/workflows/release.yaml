name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@5d3222634a0cb8b2a65ec9b00654f6f2b37e7bd1 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
