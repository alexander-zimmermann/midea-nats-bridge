name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@1fa17259c2f6924d1e5a45ebe219eb91d3d42af4 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
