name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@f1a50442ddb57c3b47d5bfe93a4ec69e0a0dcfb6 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
