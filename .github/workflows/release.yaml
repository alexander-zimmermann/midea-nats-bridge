name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@dca2412f7bf51259987ef2dfc6dd4abd02e9e1e0 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
