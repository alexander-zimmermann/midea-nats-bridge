name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@f1afb4441e41ed9157665a5ab3f0a3ab2b44d619 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
