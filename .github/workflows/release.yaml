name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@e2bbc191aaab8172b1ae3aee98bb4cf45a252c3c # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
