name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@946ae7b2efe2da294f1a0f87ed17e03a1a04ee53 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
