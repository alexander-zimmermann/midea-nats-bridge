name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@4f2581d94fe74d9dc0792e84ff4b87db7609d4e8 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
