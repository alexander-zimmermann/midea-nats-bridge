name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@a55dae592a07024c1e65d12fd7d6c03bb95e4a8d # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
