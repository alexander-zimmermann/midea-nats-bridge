name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@d28b3e17ba16d0a621bef9dc5f9fcea1a982aada # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
