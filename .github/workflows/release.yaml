name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@1e39c27c3642be21bb539dbbd1f90dbeaa3ab22b # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
