name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@f3b9da35404cd238b1a9a03583f5c8fa1eeae816 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
