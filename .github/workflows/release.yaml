name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@1bfd0ca0b57c630d41ca67761c5c9046ea57b5bb # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
