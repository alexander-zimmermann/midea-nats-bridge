name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@23b7ad2f29e3ae6b7c8615b2eb100fa677c752ca # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
