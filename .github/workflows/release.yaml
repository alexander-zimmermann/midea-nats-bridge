name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@48ddbcaab30fd6406408f8fb3721d8878d6f0f0b # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
