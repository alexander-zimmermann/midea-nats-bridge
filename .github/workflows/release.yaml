name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@b5281c10d39ec8e216a565ad6e7722dfdb0c8d1e # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
