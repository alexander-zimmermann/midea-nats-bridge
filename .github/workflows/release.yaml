name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@6cd04b6cf7b1671235b1dcd2b2d1d545068cf9a7 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
