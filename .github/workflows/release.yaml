name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@616d2b4cfd68997d079ed2a4f7a7f2f931584e2d # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
