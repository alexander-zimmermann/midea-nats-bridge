name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@9bb6b04f275ddca5971ecfde3b0e76f0b84450ce # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
