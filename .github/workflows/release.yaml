name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@231c32ddb5ac010c14a4c1838a1fdfd0d3ff7fdb # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
