name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@1f077dcf5f10e8ac455bf6daf7dd8f3e8b903c76 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
