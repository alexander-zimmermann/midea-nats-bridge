name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@6cd411d73cec7edf7e6803b03e9ea2c60bb094d2 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
