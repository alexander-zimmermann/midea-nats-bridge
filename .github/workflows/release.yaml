name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@dd0743e13ee0b331b2c28bfc9e2955c41cc8ca78 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
