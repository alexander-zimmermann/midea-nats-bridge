name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: alexander-zimmermann/lares/.github/workflows/sidecar-python-release.yaml@338a1cc0d56f0f53be5f0e0620a29b80a7cb70a6 # main
    with:
      tag: ${{ github.event.inputs.tag || '' }}
